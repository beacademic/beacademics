    <script>
      /* Compatibilidad con enlaces antiguos del sitio (https://beacademics.com/#/syncroedu):
         se redirigen a la ruta real antes de montar React. Un ancla normal (#caso-piloto)
         no empieza con "#/" y no se toca. */
      (function () {
        var hash = window.location.hash;
        if (hash && hash.indexOf('#/') === 0) {
          var target = hash.slice(1);
          if (target === '/' && window.location.pathname === '/') {
            window.history.replaceState(null, '', '/' + window.location.search);
          } else {
            window.location.replace(window.location.origin + target);
          }
        }
      })();
    </script>
